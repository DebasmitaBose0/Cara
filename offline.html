<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Cara</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f5; color: #333; }
    .offline-card { text-align: center; padding: 48px 32px; max-width: 400px; }
    .offline-card i { font-size: 72px; color: #ddd; margin-bottom: 20px; display: block; }
    .offline-card h1 { font-size: 24px; margin-bottom: 8px; }
    .offline-card p { color: #888; font-size: 15px; }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <div class="offline-card">
    <i class="ri-wifi-off-line"></i>
    <h1>You're offline</h1>
    <p>Please check your internet connection and try again.</p>
  </div>
</body>
</html>
